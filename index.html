  <script>
    // GitHub Pages SPA fallback: 404.html redirects here with the intended
    // path encoded in the query string; restore it before React Router mounts.
    (function () {
      var redirect = sessionStorage.redirect
      delete sessionStorage.redirect
      if (redirect && redirect !== location.href) {
        history.replaceState(null, '', redirect)
      }
    })()
